# CVM Services Configuration
# This file controls which services are enabled and their port assignments.
# Edit this file to customize the CVM environment.

# Agent API - Rust gRPC service for automation and skill execution
[agent-api]
enabled=true
port=8080
build_dir=/app/cvm-agent/agent-api

# Web UI - Static web interface served via Python HTTP server
[web-ui]
enabled=true
port=3000
serve_dir=/app/cvm-agent/web-ui/dist

# Notify Service - Real-time notification service (future)
[notify]
enabled=false
port=8000

# Backend Service - Additional backend functionality (future)
[backend]
enabled=false
port=8001

# Whisper - Voice transcription server using whisper.cpp
[whisper]
enabled=true
port=8082

# VNC - Virtual Network Computing for remote desktop
[vnc]
enabled=true
port=5900
resolution=1920x1080

# noVNC - Web-based VNC client
[novnc]
enabled=true
port=6080

# SSH - Secure Shell access
[ssh]
enabled=true
port=22
